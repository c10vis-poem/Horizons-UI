name: build-apk

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p horizons/libs
          curl -fL -o horizons/libs/sherpa-onnx-1.13.2.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar

      # Silero VAD — ~2 MB, and without it VadFactory silently degrades to RMS on
      # every device. It prefers SileroVadDetector when assets/silero_vad.onnx is
      # present and falls back otherwise, so a missing asset is not a build error,
      # it is a quiet downgrade nobody notices. Small enough to ship in the APK;
      # unlike the STT/TTS weights this is not a user-supplied model.
      - name: Download Silero VAD model
        run: |
          mkdir -p horizons/src/main/assets
          curl -fL -o horizons/src/main/assets/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -l horizons/src/main/assets/silero_vad.onnx

      # Kokoro v0.19 (English) TTS voice pack, bundled straight into the APK's
      # assets so the app never depends on a user-imported model directory.
      # int8 model.onnx from a third-party quantization of the same v0.19
      # model our own Mer0vin8ian/kokoro-en-v0_19 fork carries in fp32 — using
      # the int8 build here to keep the APK smaller (134 MB vs 345 MB).
      # tokens.txt + espeak-ng-data come from our own fork (your-fork-first).
      # v0.19 predates Kokoro's multi-lingual lang/lexicon requirement, so
      # this sidesteps the exit(-1) native-init crash entirely — see
      # KokoroModelManager.kt for the full story.
      - name: Download Kokoro TTS voice pack
        run: |
          set -e
          pip install -q huggingface_hub
          DEST=horizons/src/main/assets/sherpa_tts/kokoro-en-v0_19
          mkdir -p "$DEST"
          hf download RuiSumida/sherpa-onnx-kokoro-int8-en-v0_19 \
            model.onnx voices.bin --local-dir /tmp/kokoro-int8
          hf download Mer0vin8ian/kokoro-en-v0_19 \
            tokens.txt --local-dir /tmp/kokoro-fork
          hf download Mer0vin8ian/kokoro-en-v0_19 \
            --include "espeak-ng-data/*" --local-dir /tmp/kokoro-fork
          cp /tmp/kokoro-int8/model.onnx /tmp/kokoro-int8/voices.bin "$DEST/"
          cp /tmp/kokoro-fork/tokens.txt "$DEST/"
          cp -r /tmp/kokoro-fork/espeak-ng-data "$DEST/"
          du -sh "$DEST"

      - name: Cache NDK + ORT
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-ndk-r27c
            /opt/ort-android
          key: ndk-r27c-ort-1.22.0

      - name: Download Android NDK r27c
        run: |
          if [ ! -d /opt/android-ndk-r27c ]; then
            curl -fL -o /tmp/ndk.zip \
              https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q /tmp/ndk.zip -d /opt
            rm /tmp/ndk.zip
          fi

      - name: Download ORT Android headers + libs
        run: |
          if [ ! -d /opt/ort-android ]; then
            curl -fL -o /tmp/ort.aar \
              https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.22.0/onnxruntime-android-1.22.0.aar
            mkdir -p /opt/ort-android
            unzip -q /tmp/ort.aar -d /opt/ort-android
            rm /tmp/ort.aar
          fi

      - name: Build ort_engine daemon (arm64-v8a)
        run: |
          export ANDROID_NDK=/opt/android-ndk-r27c
          export ORT_ROOT=/opt/ort-android
          cmake -S daemon -B daemon/build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DORT_ROOT=$ORT_ROOT
          cmake --build daemon/build --config Release -j$(nproc)
          file daemon/build/ort_engine

      - name: Build Horizons debug APK
        run: ./gradlew :horizons:assembleDebug -PnexaEnabled=false --no-daemon --stacktrace

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp horizons/build/outputs/apk/debug/horizons-debug.apk out/horizons.apk
          cp daemon/build/ort_engine out/ort_engine
          cp /opt/ort-android/jni/arm64-v8a/libonnxruntime.so out/libonnxruntime.so
          ls -la out

      - name: Upload artifacts (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: horizons-release
          path: out/*
          if-no-files-found: error

      - name: Compute per-branch release tag (no cross-branch clobber)
        id: reltag
        run: echo "tag=debug-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Publish per-branch debug release (stable download URL, no cross-branch clobber)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: 'debug (${{ github.ref_name }}) — auto'
          body: |
            Auto-built from ${{ github.sha }} on ${{ github.ref_name }}.
            ort_engine + libonnxruntime.so go to /data/local/tmp/ on device.
          files: |
            out/horizons.apk
            out/ort_engine
            out/libonnxruntime.so
          prerelease: true
          make_latest: false
